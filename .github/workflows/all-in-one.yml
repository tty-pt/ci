name: all-in-one
permissions:
  contents: write

on:
  workflow_call:
    inputs:
      name:
        description: "Package name"
        required: true
        type: string
      deps:
        description: "Comma-separated package deps"
        required: false
        type: string
      deps_deb:
        description: 'Debian/Ubuntu dependency names'
        required: false
        default: ''
        type: string
      deps_rpm:
        description: 'Fedora/RHEL dependency names'
        required: false
        default: ''
        type: string
      deps_apk:
        description: 'Alpine dependency names'
        required: false
        default: ''
        type: string
      deps_pacman:
        description: 'Arch dependency names'
        required: false
        default: ''
        type: string
      deps_brew:
        description: 'Brew dependency names'
        required: false
        default: ''
        type: string
      deps_openbsd:
        description: 'OpenBSD dependency names'
        required: false
        default: ''
        type: string
      deps_pacman_mingw:
        description: 'Msys dependency names'
        required: false
        default: ''
        type: string
      deps_winget:
        description: 'Windows/MSYS2 dependency names'
        required: false
        default: ''
        type: string
      deps_winget_tty:
        description: 'tty.pt-hosted winget deps (space-separated bare names)'
        required: false
        default: ''
        type: string
      deps_aur:
        description: 'Arch AUR dependency names'
        required: false
        default: ''
        type: string
      deps_aur_mingw:
        description: 'Arch AUR mingw dependency names'
        required: false
        default: ''
        type: string
      publish_to:
        description: "Package managers to publish to"
        required: false
        default: "deb,apk,pacman,rpm,brew,openbsd,pacman_mingw,winget"
        type: string
      run_tests:
        description: "Run shared test phase before packaging"
        required: false
        default: true
        type: boolean
      test_setup:
        description: "Optional shell setup command before tests"
        required: false
        default: ''
        type: string
      test_build:
        description: "Build command for shared test phase"
        required: false
        default: 'make'
        type: string
      test_command:
        description: "Test command for shared test phase"
        required: false
        default: 'make test'
        type: string
      run_package:
        description: "Run package phase"
        required: false
        default: true
        type: boolean
      run_publish:
        description: "Run publish phase"
        required: false
        default: true
        type: boolean
      publish_npm:
        description: "Publish npm package to registry"
        required: false
        default: true
        type: boolean
      repo_name:
        description: "Repository name for pacman and RPM"
        required: false
        default: "ttypt"
        type: string
    secrets:
      HOST:
        required: false
      USER:
        required: false
      SSH_KEY:
        required: false
      GPG_PRIVATE_KEY:
        required: false
      GPG_PASSPHRASE:
        required: false
      GPG_KEYID:
        required: false
      ABUILD_PRIVATE_KEY:
        required: false
      ABUILD_PUBLIC_KEY:
        required: false
      TAP_TOKEN:
        required: false
      NPM_TOKEN:
        required: false
      OPENBSD_HOST:
        required: false
      OPENBSD_USER:
        required: false
      OPENBSD_SSH_KEY:
        required: false
      OPENBSD_GPG_PRIVATE_KEY:
        required: false
      OPENBSD_GPG_PASSPHRASE:
        required: false
      OPENBSD_GPG_KEY_ID:
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run shared test phase
        if: inputs.run_tests
        uses: tty-pt/ci/test@main
        with:
          deps: ${{ inputs.deps || '' }}
          deps_deb: ${{ inputs.deps_deb || '' }}
          setup: ${{ inputs.test_setup }}
          build: ${{ inputs.test_build }}
          command: ${{ inputs.test_command }}
      - name: Skip shared test phase
        if: ${{ !inputs.run_tests }}
        run: echo "Shared test phase disabled"

  package:
    if: inputs.run_package
    needs: test
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image || null }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/ubuntu-builder:latest
          - format: apk
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/alpine-builder:latest
          - format: pacman
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/arch-builder:latest
          - format: rpm
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/rocky-builder:latest
          - format: pacman_mingw
            repo: pacman
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/mingw-builder:latest
          - format: openbsd
            runner: ubuntu-latest
          - format: brew
            arch: arm64
            runner: macos-latest
          - format: brew
            arch: x86_64
            runner: macos-15-intel
          - format: winget
            runner: windows-latest

    steps:
      - name: Package for ${{ matrix.format }} (${{ matrix.arch || 'default' }})
        if: contains(format(',{0},', inputs.publish_to), format(',{0},', matrix.format))
        uses: tty-pt/ci/package@main
        with:
          name: ${{ inputs.name }}
          format: ${{ matrix.format }}
          repo: ${{ matrix.repo }}
          ext: ${{ (matrix.format == 'pacman' || matrix.format == 'pacman_mingw') && 'pkg.tar.*' || '' }}
          deps: ${{ inputs.deps }}
          deps_deb: ${{ inputs.deps_deb || '' }}
          deps_apk: ${{ inputs.deps_apk || '' }}
          deps_pacman: ${{ inputs.deps_pacman || '' }}
          deps_aur: ${{ inputs.deps_aur || '' }}
          deps_rpm: ${{ inputs.deps_rpm || '' }}
          deps_pacman_mingw: ${{ inputs.deps_pacman_mingw || '' }}
          deps_aur_mingw: ${{ inputs.deps_aur_mingw || '' }}
          deps_brew: ${{ inputs.deps_brew || '' }}
          deps_openbsd: ${{ inputs.deps_openbsd || '' }}
          deps_winget: ${{ inputs.deps_winget || '' }}
          deps_winget_tty: ${{ inputs.deps_winget_tty || '' }}
          gpg_key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg_pass: ${{ secrets.GPG_PASSPHRASE }}
          gpg_keyid: ${{ secrets.GPG_KEYID }}
          abuild_key: ${{ secrets.ABUILD_PRIVATE_KEY || '' }}
          abuild_pub: ${{ secrets.ABUILD_PUBLIC_KEY || '' }}
          host: ${{ secrets.HOST || secrets.OPENBSD_HOST || '' }}
          user: ${{ secrets.USER || secrets.OPENBSD_USER || '' }}
          ssh_key: ${{ secrets.SSH_KEY || secrets.OPENBSD_SSH_KEY || '' }}

  publish:
    if: inputs.run_package && inputs.run_publish
    needs: package
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image || null }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/ubuntu-builder:latest
          - format: apk
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/alpine-builder:latest
          - format: pacman
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/arch-builder:latest
          - format: rpm
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/rocky-builder:latest
          - format: pacman_mingw
            repo: pacman
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/mingw-builder:latest
          - format: openbsd
            runner: ubuntu-latest
          - format: brew
            arch: arm64
            runner: macos-latest
          - format: brew
            arch: x86_64
            runner: macos-15-intel
          - format: winget
            runner: ubuntu-latest

    steps:
      - name: Publish ${{ matrix.format }}
        if: contains(format(',{0},', inputs.publish_to), format(',{0},', matrix.format))
        uses: tty-pt/ci/publish@main
        with:
          name: ${{ inputs.name }}
          format: ${{ matrix.format }}
          repo: ${{ matrix.repo }}
          host: ${{ secrets.HOST || secrets.OPENBSD_HOST }}
          user: ${{ secrets.USER || secrets.OPENBSD_USER }}
          ssh_key: ${{ secrets.SSH_KEY || secrets.OPENBSD_SSH_KEY }}
          deps: ${{ inputs.deps || '' }}
          deps_brew: ${{ inputs.deps_brew || '' }}
          gpg_key: ${{ secrets.GPG_PRIVATE_KEY || secrets.OPENBSD_GPG_PRIVATE_KEY }}
          gpg_keyid: ${{ secrets.GPG_KEYID || secrets.OPENBSD_GPG_KEY_ID }}
          gpg_pass: ${{ secrets.GPG_PASSPHRASE || secrets.OPENBSD_GPG_PASSPHRASE }}
          abuild_key: ${{ secrets.ABUILD_PRIVATE_KEY || '' }}
          abuild_pub: ${{ secrets.ABUILD_PUBLIC_KEY || '' }}
          tap_token: ${{ secrets.TAP_TOKEN || '' }}

  release:
    if: inputs.run_package && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Create and publish GitHub Release
        uses: tty-pt/ci/release@main
        with:
          gpg_key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg_keyid: ${{ secrets.GPG_KEYID }}
          gpg_pass: ${{ secrets.GPG_PASSPHRASE }}

  npm:
    if: (inputs.publish_npm || contains(format(',{0},', inputs.publish_to), ',npm,')) && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [package, publish]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install build toolchain for WASM
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib clang wasi-libc libclang-rt-*-dev-wasm32 2>/dev/null || sudo apt-get install -y gcc-multilib clang wasi-libc || true

      - name: Build and publish NPM package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.TAP_TOKEN }}
        run: |
          pkg_dir=""
          if [ -f "npm/package.json" ]; then
            pkg_dir="npm"
          elif [ -f "package.json" ]; then
            pkg_dir="."
          fi

          if [ -n "$pkg_dir" ]; then
            echo "📦 Found npm package in $pkg_dir"
            cd "$pkg_dir"
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            PKG_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || true)
            if [ -n "$PKG_VERSION" ] && [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::package.json version ($PKG_VERSION) does not match release tag ($TAG_VERSION)!"
              exit 1
            fi
            if [ -n "$TAG_VERSION" ]; then
              npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version || true
            fi
            npm install --ignore-scripts
            npm run build
            npm test
            if [ -n "$NODE_AUTH_TOKEN" ]; then
              npm publish --access public
              echo "✅ Successfully published NPM package to registry!"
            else
              echo "⚠️ Neither NPM_TOKEN nor TAP_TOKEN secret configured; skipping publish."
            fi
          else
            echo "ℹ️ No package.json or npm/package.json found; skipping npm job"
          fi
