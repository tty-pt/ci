name: all-in-one
permissions:
  contents: write

on:
  workflow_call:
    inputs:
      name:
        description: "Package name"
        required: true
        type: string
      deps:
        description: "Comma-separated package deps"
        required: false
        type: string
      deps_deb:
        description: 'Debian/Ubuntu dependency names'
        required: false
        default: ''
        type: string
      deps_rpm:
        description: 'Fedora/RHEL dependency names'
        required: false
        default: ''
        type: string
      deps_apk:
        description: 'Alpine dependency names'
        required: false
        default: ''
        type: string
      deps_pacman:
        description: 'Arch dependency names'
        required: false
        default: ''
        type: string
      deps_brew:
        description: 'Brew dependency names'
        required: false
        default: ''
        type: string
      deps_openbsd:
        description: 'OpenBSD dependency names'
        required: false
        default: ''
        type: string
      deps_pacman_mingw:
        description: 'Msys dependency names'
        required: false
        default: ''
        type: string
      deps_winget:
        description: 'Windows/MSYS2 dependency names'
        required: false
        default: ''
        type: string
      deps_winget_tty:
        description: 'tty.pt-hosted winget deps (space-separated bare names)'
        required: false
        default: ''
        type: string
      deps_aur:
        description: 'Arch AUR dependency names'
        required: false
        default: ''
        type: string
      deps_aur_mingw:
        description: 'Arch AUR mingw dependency names'
        required: false
        default: ''
        type: string
      publish_to:
        description: "Package managers to publish to"
        required: false
        default: "deb,apk,pacman,rpm,brew,openbsd,winget"
        type: string
      run_tests:
        description: "Run shared test phase before packaging"
        required: false
        default: true
        type: boolean
      test_setup:
        description: "Optional shell setup command before tests"
        required: false
        default: ''
        type: string
      test_build:
        description: "Build command for shared test phase"
        required: false
        default: 'make'
        type: string
      test_command:
        description: "Test command for shared test phase"
        required: false
        default: 'make test'
        type: string
      run_package:
        description: "Run package phase"
        required: false
        default: true
        type: boolean
      run_publish:
        description: "Run publish phase"
        required: false
        default: true
        type: boolean
      publish_npm:
        description: "Publish npm package to registry"
        required: false
        default: true
        type: boolean
      repo_name:
        description: "Repository name for pacman and RPM"
        required: false
        default: "ttypt"
        type: string
    secrets:
      HOST:
        required: false
      USER:
        required: false
      SSH_KEY:
        required: false
      GPG_PRIVATE_KEY:
        required: false
      GPG_PASSPHRASE:
        required: false
      GPG_KEYID:
        required: false
      ABUILD_PRIVATE_KEY:
        required: false
      ABUILD_PUBLIC_KEY:
        required: false
      TAP_TOKEN:
        required: false
      NPM_TOKEN:
        required: false
      OPENBSD_HOST:
        required: false
      OPENBSD_USER:
        required: false
      OPENBSD_SSH_KEY:
        required: false
      OPENBSD_GPG_PRIVATE_KEY:
        required: false
      OPENBSD_GPG_PASSPHRASE:
        required: false
      OPENBSD_GPG_KEY_ID:
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run shared test phase
        if: inputs.run_tests
        uses: tty-pt/ci/test@main
        with:
          deps: ${{ inputs.deps || '' }}
          deps_deb: ${{ inputs.deps_deb || '' }}
          setup: ${{ inputs.test_setup }}
          build: ${{ inputs.test_build }}
          command: ${{ inputs.test_command }}
      - name: Skip shared test phase
        if: ${{ !inputs.run_tests }}
        run: echo "Shared test phase disabled"

  package:
    if: inputs.run_package
    needs: test
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image || null }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/ubuntu-builder:latest
          - format: apk
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/alpine-builder:latest
          - format: pacman
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/arch-builder:latest
          - format: rpm
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/rocky-builder:latest
          - format: openbsd
            runner: ubuntu-latest
          - format: brew
            arch: arm64
            runner: macos-latest
          - format: brew
            arch: x86_64
            runner: macos-15-intel
          - format: winget
            runner: windows-latest

    steps:
      - name: Package for ${{ matrix.format }} (${{ matrix.arch || 'default' }})
        if: contains(format(',{0},', inputs.publish_to), format(',{0},', matrix.format))
        uses: tty-pt/ci/package@main
        with:
          name: ${{ inputs.name }}
          format: ${{ matrix.format }}
          repo: ${{ matrix.repo }}
          ext: ${{ matrix.format == 'pacman' && 'pkg.tar.*' || '' }}
          deps: ${{ inputs.deps }}
          deps_deb: ${{ inputs.deps_deb || '' }}
          deps_apk: ${{ inputs.deps_apk || '' }}
          deps_pacman: ${{ inputs.deps_pacman || '' }}
          deps_aur: ${{ inputs.deps_aur || '' }}
          deps_rpm: ${{ inputs.deps_rpm || '' }}
          deps_brew: ${{ inputs.deps_brew || '' }}
          deps_openbsd: ${{ inputs.deps_openbsd || '' }}
          deps_winget: ${{ inputs.deps_winget || '' }}
          deps_winget_tty: ${{ inputs.deps_winget_tty || '' }}
          gpg_key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg_pass: ${{ secrets.GPG_PASSPHRASE }}
          gpg_keyid: ${{ secrets.GPG_KEYID }}
          abuild_key: ${{ secrets.ABUILD_PRIVATE_KEY || '' }}
          abuild_pub: ${{ secrets.ABUILD_PUBLIC_KEY || '' }}
          host: ${{ secrets.HOST || secrets.OPENBSD_HOST || '' }}
          user: ${{ secrets.USER || secrets.OPENBSD_USER || '' }}
          ssh_key: ${{ secrets.SSH_KEY || secrets.OPENBSD_SSH_KEY || '' }}
          node_addon: ${{ inputs.publish_npm && 'true' || 'false' }}

  publish:
    if: inputs.run_package && inputs.run_publish
    needs: package
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image || null }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/ubuntu-builder:latest
          - format: apk
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/alpine-builder:latest
          - format: pacman
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/arch-builder:latest
          - format: rpm
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/rocky-builder:latest
          - format: openbsd
            runner: ubuntu-latest
          - format: brew
            arch: arm64
            runner: macos-latest
          - format: brew
            arch: x86_64
            runner: macos-15-intel
          - format: winget
            runner: ubuntu-latest

    steps:
      - name: Publish ${{ matrix.format }}
        if: contains(format(',{0},', inputs.publish_to), format(',{0},', matrix.format))
        uses: tty-pt/ci/publish@main
        with:
          name: ${{ inputs.name }}
          format: ${{ matrix.format }}
          repo: ${{ matrix.repo }}
          host: ${{ secrets.HOST || secrets.OPENBSD_HOST }}
          user: ${{ secrets.USER || secrets.OPENBSD_USER }}
          ssh_key: ${{ secrets.SSH_KEY || secrets.OPENBSD_SSH_KEY }}
          deps: ${{ inputs.deps || '' }}
          deps_brew: ${{ inputs.deps_brew || '' }}
          gpg_key: ${{ secrets.GPG_PRIVATE_KEY || secrets.OPENBSD_GPG_PRIVATE_KEY }}
          gpg_keyid: ${{ secrets.GPG_KEYID || secrets.OPENBSD_GPG_KEY_ID }}
          gpg_pass: ${{ secrets.GPG_PASSPHRASE || secrets.OPENBSD_GPG_PASSPHRASE }}
          abuild_key: ${{ secrets.ABUILD_PRIVATE_KEY || '' }}
          abuild_pub: ${{ secrets.ABUILD_PUBLIC_KEY || '' }}
          tap_token: ${{ secrets.TAP_TOKEN || '' }}

  release:
    if: inputs.run_package && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Create and publish GitHub Release
        uses: tty-pt/ci/release@main
        with:
          gpg_key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg_keyid: ${{ secrets.GPG_KEYID }}
          gpg_pass: ${{ secrets.GPG_PASSPHRASE }}

  # ---------------------------------------------------------------------------------------------
  # npm. A repository with npm/package.json is an npm package; nothing needs to be declared.
  #
  #   npm-detect   what is there: npm/package.json, a Node addon (npm/native/*_napi.c), and which
  #                platform prebuilds the selected package formats will produce
  #   package      (above) also builds one self-contained Node addon per platform when there is one
  #   node-arm64   builds the linux-arm64 Node addon prebuild on ubuntu-24.04-arm
  #   npm          (npm.yml) packs ONE tarball, verifies it on each platform, publishes it (tags only)
  # ---------------------------------------------------------------------------------------------
  npm-detect:
    if: inputs.run_package && inputs.publish_npm
    runs-on: ubuntu-latest
    outputs:
      npm: ${{ steps.d.outputs.npm }}
      dir: ${{ steps.d.outputs.dir }}
      native: ${{ steps.d.outputs.native }}
      expect: ${{ steps.d.outputs.expect }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect npm package and Node addon
        id: d
        shell: bash
        env:
          PUBLISH_TO: ${{ inputs.publish_to }}
        run: |
          set -eu
          npm=false
          dir=npm
          native=false
          expect=""
          if [ -f npm/package.json ]; then
            npm=true
          elif [ -f package.json ] && node -e "const p=require('./package.json'); process.exit(p.name && !p.private ? 0 : 1)"; then
            # a package at the repository root (axil-tty)
            npm=true
            dir=.
          fi
          for f in npm/native/*_napi.c; do
            if [ -f "$f" ]; then native=true; fi
          done
          # Which platform prebuilds the selected package formats produce (see the package action).
          if [ "$native" = true ]; then
            has() { case ",$PUBLISH_TO," in *",$1,"*) return 0 ;; esac; return 1; }
            if has rpm; then expect="$expect,linux-x64,linux-arm64"; fi
            if has apk; then expect="$expect,linux-x64-musl"; fi
            if has brew; then expect="$expect,darwin-arm64,darwin-x64"; fi
            if has winget; then expect="$expect,win32-x64"; fi
            expect=${expect#,}
          fi
          echo "npm=$npm dir=$dir native=$native expect=$expect"
          {
            echo "npm=$npm"
            echo "dir=$dir"
            echo "native=$native"
            echo "expect=$expect"
          } >> "$GITHUB_OUTPUT"

  node-arm64:
    if: inputs.run_package && inputs.publish_npm && needs.npm-detect.outputs.native == 'true' && contains(format(',{0},', inputs.publish_to), ',rpm,')
    needs: [test, npm-detect]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Checkout tty-pt/ci
        uses: actions/checkout@v4
        with:
          repository: tty-pt/ci
          ref: main
          path: .ci

      - name: Fetch include.mk from tty-pt/mk
        shell: bash
        run: |
          [ -d "../mk" ] || git clone --depth 1 --branch main https://github.com/tty-pt/mk ../mk

      - name: Build project and linux-arm64 Node addon prebuild
        id: build_arm64
        shell: bash
        env:
          DEPS_RAW: ${{ inputs.deps_deb || inputs.deps || '' }}
        run: |
          set -eu
          sudo apt-get update -y
          sudo apt-get install -y patchelf doxygen

          built_repos=" "
          install_dep() {
            local dep="$1"
            [ -n "$dep" ] || return 0
            case "$built_repos" in *" $dep "*) return 0 ;; esac
            built_repos="$built_repos$dep "

            if apt-cache show "$dep" >/dev/null 2>&1; then
              sudo apt-get install -y "$dep"
              return 0
            fi

            local repodir="../$dep"
            if [ ! -d "$repodir" ]; then
              git clone --depth 1 --branch main "https://github.com/tty-pt/$dep.git" "$repodir"
            fi
            if [ -f "$repodir/.github/workflows/ci.yml" ]; then
              local subdeps
              subdeps=$(awk -F'"' '/^[[:space:]]*deps_deb:/ {print $2; exit} /^[[:space:]]*deps:/ {d=$2} END {if (d) print d}' "$repodir/.github/workflows/ci.yml")
              for sd in $(echo "$subdeps" | tr ',' ' '); do
                install_dep "$sd"
              done
            fi
            make -C "$repodir" PREFIX=/usr
            sudo make -C "$repodir" PREFIX=/usr install
            sudo ldconfig
          }

          for d in $(echo "$DEPS_RAW" | tr ',' ' '); do
            install_dep "$d"
          done

          make DESTDIR="$PWD/stage" PREFIX=/usr
          sh .ci/scripts/build-node-addon.sh node-addon-out

      - name: Upload linux-arm64 Node addon prebuild
        uses: actions/upload-artifact@v4
        with:
          name: node-prebuild-${{ steps.build_arm64.outputs.key }}
          path: node-addon-out/*.tar.gz
          if-no-files-found: error

  # The npm half (pack, verify, publish) is the reusable npm.yml, shared with npm-only repositories.
  # It runs after the OS packages are published, so npm never gets a release the other formats lack.
  npm:
    if: always() && inputs.run_package && needs.npm-detect.outputs.npm == 'true' && needs.package.result == 'success' && (needs.node-arm64.result == 'success' || needs.node-arm64.result == 'skipped') && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    needs: [package, publish, npm-detect, node-arm64]
    uses: tty-pt/ci/.github/workflows/npm.yml@main
    with:
      dir: ${{ needs.npm-detect.outputs.dir }}
      expect: ${{ needs.npm-detect.outputs.expect }}
      publish: ${{ inputs.run_publish }}
    secrets: inherit
