name: all-in-one
permissions:
  contents: write

on:
  workflow_call:
    inputs:
      name:
        description: "Package name"
        required: true
        type: string
      deps:
        description: "Comma-separated package deps"
        required: false
        type: string
      deps_deb:
        description: 'Debian/Ubuntu dependency names'
        required: false
        default: ''
        type: string
      deps_rpm:
        description: 'Fedora/RHEL dependency names'
        required: false
        default: ''
        type: string
      deps_apk:
        description: 'Alpine dependency names'
        required: false
        default: ''
        type: string
      deps_pacman:
        description: 'Arch dependency names'
        required: false
        default: ''
        type: string
      deps_brew:
        description: 'Brew dependency names'
        required: false
        default: ''
        type: string
      deps_openbsd:
        description: 'OpenBSD dependency names'
        required: false
        default: ''
        type: string
      deps_pacman_mingw:
        description: 'Msys dependency names'
        required: false
        default: ''
        type: string
      deps_winget:
        description: 'Windows/MSYS2 dependency names'
        required: false
        default: ''
        type: string
      deps_winget_tty:
        description: 'tty.pt-hosted winget deps (space-separated bare names)'
        required: false
        default: ''
        type: string
      deps_aur:
        description: 'Arch AUR dependency names'
        required: false
        default: ''
        type: string
      deps_aur_mingw:
        description: 'Arch AUR mingw dependency names'
        required: false
        default: ''
        type: string
      publish_to:
        description: "Package managers to publish to"
        required: false
        default: "deb,apk,pacman,rpm,brew,openbsd,pacman_mingw,winget"
        type: string
      run_tests:
        description: "Run shared test phase before packaging"
        required: false
        default: true
        type: boolean
      test_setup:
        description: "Optional shell setup command before tests"
        required: false
        default: ''
        type: string
      test_build:
        description: "Build command for shared test phase"
        required: false
        default: 'make'
        type: string
      test_command:
        description: "Test command for shared test phase"
        required: false
        default: 'make test'
        type: string
      run_package:
        description: "Run package phase"
        required: false
        default: true
        type: boolean
      run_publish:
        description: "Run publish phase"
        required: false
        default: true
        type: boolean
      publish_npm:
        description: "Publish npm package to registry"
        required: false
        default: true
        type: boolean
      repo_name:
        description: "Repository name for pacman and RPM"
        required: false
        default: "ttypt"
        type: string
    secrets:
      HOST:
        required: false
      USER:
        required: false
      SSH_KEY:
        required: false
      GPG_PRIVATE_KEY:
        required: false
      GPG_PASSPHRASE:
        required: false
      GPG_KEYID:
        required: false
      ABUILD_PRIVATE_KEY:
        required: false
      ABUILD_PUBLIC_KEY:
        required: false
      TAP_TOKEN:
        required: false
      NPM_TOKEN:
        required: false
      OPENBSD_HOST:
        required: false
      OPENBSD_USER:
        required: false
      OPENBSD_SSH_KEY:
        required: false
      OPENBSD_GPG_PRIVATE_KEY:
        required: false
      OPENBSD_GPG_PASSPHRASE:
        required: false
      OPENBSD_GPG_KEY_ID:
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run shared test phase
        if: inputs.run_tests
        uses: tty-pt/ci/test@main
        with:
          deps: ${{ inputs.deps || '' }}
          deps_deb: ${{ inputs.deps_deb || '' }}
          setup: ${{ inputs.test_setup }}
          build: ${{ inputs.test_build }}
          command: ${{ inputs.test_command }}
      - name: Skip shared test phase
        if: ${{ !inputs.run_tests }}
        run: echo "Shared test phase disabled"

  package:
    if: inputs.run_package
    needs: test
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image || null }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/ubuntu-builder:latest
          - format: apk
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/alpine-builder:latest
          - format: pacman
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/arch-builder:latest
          - format: rpm
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/rocky-builder:latest
          - format: pacman_mingw
            repo: pacman
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/mingw-builder:latest
          - format: openbsd
            runner: ubuntu-latest
          - format: brew
            arch: arm64
            runner: macos-latest
          - format: brew
            arch: x86_64
            runner: macos-15-intel
          - format: winget
            runner: windows-latest

    steps:
      - name: Package for ${{ matrix.format }} (${{ matrix.arch || 'default' }})
        if: contains(format(',{0},', inputs.publish_to), format(',{0},', matrix.format))
        uses: tty-pt/ci/package@main
        with:
          name: ${{ inputs.name }}
          format: ${{ matrix.format }}
          repo: ${{ matrix.repo }}
          ext: ${{ (matrix.format == 'pacman' || matrix.format == 'pacman_mingw') && 'pkg.tar.*' || '' }}
          deps: ${{ inputs.deps }}
          deps_deb: ${{ inputs.deps_deb || '' }}
          deps_apk: ${{ inputs.deps_apk || '' }}
          deps_pacman: ${{ inputs.deps_pacman || '' }}
          deps_aur: ${{ inputs.deps_aur || '' }}
          deps_rpm: ${{ inputs.deps_rpm || '' }}
          deps_pacman_mingw: ${{ inputs.deps_pacman_mingw || '' }}
          deps_aur_mingw: ${{ inputs.deps_aur_mingw || '' }}
          deps_brew: ${{ inputs.deps_brew || '' }}
          deps_openbsd: ${{ inputs.deps_openbsd || '' }}
          deps_winget: ${{ inputs.deps_winget || '' }}
          deps_winget_tty: ${{ inputs.deps_winget_tty || '' }}
          gpg_key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg_pass: ${{ secrets.GPG_PASSPHRASE }}
          gpg_keyid: ${{ secrets.GPG_KEYID }}
          abuild_key: ${{ secrets.ABUILD_PRIVATE_KEY || '' }}
          abuild_pub: ${{ secrets.ABUILD_PUBLIC_KEY || '' }}
          host: ${{ secrets.HOST || secrets.OPENBSD_HOST || '' }}
          user: ${{ secrets.USER || secrets.OPENBSD_USER || '' }}
          ssh_key: ${{ secrets.SSH_KEY || secrets.OPENBSD_SSH_KEY || '' }}
          node_addon: ${{ inputs.publish_npm && 'true' || 'false' }}

  publish:
    if: inputs.run_package && inputs.run_publish
    needs: package
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image || null }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/ubuntu-builder:latest
          - format: apk
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/alpine-builder:latest
          - format: pacman
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/arch-builder:latest
          - format: rpm
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/rocky-builder:latest
          - format: pacman_mingw
            repo: pacman
            runner: ubuntu-latest
            image: ghcr.io/tty-pt/mingw-builder:latest
          - format: openbsd
            runner: ubuntu-latest
          - format: brew
            arch: arm64
            runner: macos-latest
          - format: brew
            arch: x86_64
            runner: macos-15-intel
          - format: winget
            runner: ubuntu-latest

    steps:
      - name: Publish ${{ matrix.format }}
        if: contains(format(',{0},', inputs.publish_to), format(',{0},', matrix.format))
        uses: tty-pt/ci/publish@main
        with:
          name: ${{ inputs.name }}
          format: ${{ matrix.format }}
          repo: ${{ matrix.repo }}
          host: ${{ secrets.HOST || secrets.OPENBSD_HOST }}
          user: ${{ secrets.USER || secrets.OPENBSD_USER }}
          ssh_key: ${{ secrets.SSH_KEY || secrets.OPENBSD_SSH_KEY }}
          deps: ${{ inputs.deps || '' }}
          deps_brew: ${{ inputs.deps_brew || '' }}
          gpg_key: ${{ secrets.GPG_PRIVATE_KEY || secrets.OPENBSD_GPG_PRIVATE_KEY }}
          gpg_keyid: ${{ secrets.GPG_KEYID || secrets.OPENBSD_GPG_KEY_ID }}
          gpg_pass: ${{ secrets.GPG_PASSPHRASE || secrets.OPENBSD_GPG_PASSPHRASE }}
          abuild_key: ${{ secrets.ABUILD_PRIVATE_KEY || '' }}
          abuild_pub: ${{ secrets.ABUILD_PUBLIC_KEY || '' }}
          tap_token: ${{ secrets.TAP_TOKEN || '' }}

  release:
    if: inputs.run_package && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Create and publish GitHub Release
        uses: tty-pt/ci/release@main
        with:
          gpg_key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg_keyid: ${{ secrets.GPG_KEYID }}
          gpg_pass: ${{ secrets.GPG_PASSPHRASE }}

  # ---------------------------------------------------------------------------------------------
  # npm. A repository with npm/package.json is an npm package; nothing needs to be declared.
  #
  #   npm-detect   what is there: npm/package.json, a Node addon (npm/native/*_napi.c), and which
  #                platform prebuilds the selected package formats will produce
  #   package      (above) also builds one self-contained Node addon per platform when there is one
  #   npm-pack     builds the WebAssembly, adds the prebuilds, runs the tests, packs ONE tarball
  #   npm-verify   installs that tarball into an empty project on each platform and loads it
  #   npm-publish  publishes that very tarball (tags only); nothing is compiled when publishing
  # ---------------------------------------------------------------------------------------------
  npm-detect:
    if: inputs.run_package && inputs.publish_npm
    runs-on: ubuntu-latest
    outputs:
      npm: ${{ steps.d.outputs.npm }}
      native: ${{ steps.d.outputs.native }}
      expect: ${{ steps.d.outputs.expect }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect npm package and Node addon
        id: d
        shell: bash
        env:
          PUBLISH_TO: ${{ inputs.publish_to }}
        run: |
          set -eu
          npm=false
          native=false
          expect=""
          if [ -f npm/package.json ]; then npm=true; fi
          for f in npm/native/*_napi.c; do
            if [ -f "$f" ]; then native=true; fi
          done
          # Which platform prebuilds the selected package formats produce (see the package action).
          if [ "$native" = true ]; then
            has() { case ",$PUBLISH_TO," in *",$1,"*) return 0 ;; esac; return 1; }
            if has rpm; then expect="$expect,linux-x64"; fi
            if has brew; then expect="$expect,darwin-arm64,darwin-x64"; fi
            if has winget; then expect="$expect,win32-x64"; fi
            expect=${expect#,}
          fi
          echo "npm=$npm native=$native expect=$expect"
          {
            echo "npm=$npm"
            echo "native=$native"
            echo "expect=$expect"
          } >> "$GITHUB_OUTPUT"

  npm-pack:
    if: inputs.run_package && needs.npm-detect.outputs.npm == 'true'
    needs: [package, npm-detect]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install build toolchain for WASM
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib clang wasi-libc binaryen libclang-rt-*-dev-wasm32 2>/dev/null || sudo apt-get install -y gcc-multilib clang wasi-libc binaryen || true

      - name: Fetch include.mk from tty-pt/mk
        shell: bash
        run: |
          [ -d "../mk" ] || git clone --depth 1 --branch main https://github.com/tty-pt/mk ../mk

      - name: Download Node addon prebuilds
        if: needs.npm-detect.outputs.native == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: node-prebuild-*
          path: node-prebuilds
          merge-multiple: true

      - name: Assemble, build WebAssembly, test and pack
        shell: bash
        env:
          EXPECT: ${{ needs.npm-detect.outputs.expect }}
          NATIVE: ${{ needs.npm-detect.outputs.native }}
        run: |
          set -eu
          cd npm

          if [ "$NATIVE" = true ]; then
            ls -l ../node-prebuilds
            for t in ../node-prebuilds/*.tar.gz; do tar -xzf "$t" -C .; done
            missing=""
            for k in $(echo "$EXPECT" | tr ',' ' '); do
              [ -d "prebuilds/$k" ] || missing="$missing $k"
            done
            if [ -n "$missing" ]; then
              echo "::error::missing Node addon prebuilds for:$missing"
              exit 1
            fi
          fi

          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            PKG_VERSION=$(node -p "require('./package.json').version")
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::package.json version ($PKG_VERSION) does not match release tag ($TAG_VERSION)!"
              exit 1
            fi
          fi

          # The prebuilds must be part of the tarball even if package.json forgot to list them.
          if [ -d prebuilds ]; then
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              if (Array.isArray(p.files) && !p.files.includes('prebuilds')) {
                p.files.push('prebuilds');
                fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\\n');
                console.log('added prebuilds to package.json files (add it to the repository too)');
              }"
          fi

          npm install --ignore-scripts

          # WebAssembly is the portable backend every consumer gets: build it explicitly. 'npm run
          # build' is not used when build:wasm exists because it also compiles the native addon,
          # which belongs to the per-platform package jobs, not to this runner.
          has_script() { node -e "const s=require('./package.json').scripts||{}; process.exit(s['$1']?0:1)"; }
          wants_wasm=false
          if has_script build:wasm; then
            wants_wasm=true
            npm run build:wasm
          elif has_script build; then
            npm run build
          else
            echo "no build script"
          fi

          npm test
          npm pack --pack-destination ..
          cd ..
          tgz=$(ls ./*.tgz)
          echo "packed $tgz"
          tar -tzf "$tgz" > tarball.lst
          if [ "$NATIVE" = true ]; then
            for k in $(echo "$EXPECT" | tr ',' ' '); do
              grep -qF "package/prebuilds/$k/" tarball.lst || { echo "::error::$tgz has no prebuilds/$k"; exit 1; }
            done
          fi
          if [ "$wants_wasm" = true ]; then
            grep -qF ".wasm" tarball.lst || { echo "::error::$tgz contains no .wasm although build:wasm exists"; exit 1; }
          fi
          grep -v "node_modules" tarball.lst | head -60

      - name: Upload npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: '*.tgz'
          if-no-files-found: error

  npm-verify:
    if: inputs.run_package && needs.npm-detect.outputs.npm == 'true'
    needs: [npm-detect, npm-pack]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            key: linux-x64
          - runner: macos-latest
            key: darwin-arm64
          - runner: macos-15-intel
            key: darwin-x64
          - runner: windows-latest
            key: win32-x64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout tty-pt/ci (verification script)
        uses: actions/checkout@v4
        with:
          repository: tty-pt/ci
          ref: main
          path: .ci

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Download npm tarball
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: pkg

      - name: Install the tarball into an empty project and load it
        env:
          EXPECT: ${{ needs.npm-detect.outputs.expect }}
        run: |
          set -eu
          # A platform that has a prebuild must load the native addon; any other platform must
          # still install and load the package through WebAssembly.
          mode=wasm
          case ",$EXPECT," in *",${{ matrix.key }},"*) mode=native ;; esac
          mkdir verify
          cd verify
          npm init -y > /dev/null
          npm install ../pkg/*.tgz
          node ../.ci/scripts/verify-node-addon.mjs "${{ matrix.key }}" "$mode"

  npm-publish:
    if: inputs.run_package && needs.npm-detect.outputs.npm == 'true' && startsWith(github.ref, 'refs/tags/')
    needs: [npm-detect, npm-verify, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Download npm tarball
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: pkg

      - name: Publish the verified tarball
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          ls -l pkg
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            # './' matters: npm reads 'pkg/x.tgz' as the GitHub shorthand user/repo and runs git
            npm publish "./$(ls pkg/*.tgz)" --access public
            echo "✅ Published the verified tarball to the npm registry"
          else
            echo "⚠️ NPM_TOKEN secret not configured; skipping publish (the tarball is the 'npm-package' artifact)."
          fi
