name: 'test'
description: 'Run full test suite with dependencies'
author: 'tty-pt'

inputs:
  deps:
    description: 'Generic dependency list'
    required: false
    default: ''
  deps_deb:
    description: 'Debian dependency list'
    required: false
    default: ''
  setup:
    description: 'Optional shell setup command to run before build/test'
    required: false
    default: ''
  build:
    description: 'Build command'
    required: false
    default: 'make'
  command:
    description: 'Test command'
    required: false
    default: 'make test'

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4

    - name: Configure tty.pt APT repo
      shell: sh
      run: |
        echo "deb [trusted=yes] http://tty.pt/deb stable main" | sudo tee /etc/apt/sources.list.d/ttypt.list
        sudo apt-get update -y || true

    - name: Install dependencies
      shell: sh
      run: |
        deps="${{ inputs.deps_deb || inputs.deps }}"
        echo "Installing: $deps"
        sudo rm -f /var/lib/man-db/auto-update
        if [ -n "$deps" ]; then
          sudo apt-get install -y $(echo "$deps" | tr ',' ' ')
        fi

    - name: Fetch mk includes
      shell: sh
      run: git clone --branch main https://github.com/tty-pt/mk ../mk

    - name: Test setup
      if: inputs.setup != ''
      shell: sh
      run: ${{ inputs.setup }}

    - name: Validate Pkg-config Version Parity
      shell: sh
      run: |
        TAG_VER="${GITHUB_REF_NAME#v}"
        for pc in *.pc npm/*.pc; do
          [ -f "$pc" ] || continue
          pc_ver=$(grep -i '^Version:' "$pc" | head -n 1 | awk '{print $2}')
          if [ -n "$pc_ver" ]; then
            echo "Checking $pc (Version: $pc_ver)..."
            if [ -n "$TAG_VER" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
              if [ "$pc_ver" != "$TAG_VER" ]; then
                echo "::error::Pkg-config version in $pc ($pc_ver) does not match release tag ($TAG_VER)!"
                exit 1
              fi
            fi
            if [ -f "npm/package.json" ]; then
              pkg_ver=$(node -p "require('./npm/package.json').version" 2>/dev/null || true)
              if [ -n "$pkg_ver" ] && [ "$pc_ver" != "$pkg_ver" ]; then
                echo "::error::Pkg-config version in $pc ($pc_ver) does not match npm/package.json ($pkg_ver)!"
                exit 1
              fi
            fi
          fi
        done
        echo "Pkg-config version validation: PASS"

    - name: Build and test
      shell: sh
      run: |
        ${{ inputs.build }}
        export LD_LIBRARY_PATH=$PWD/lib:${LD_LIBRARY_PATH}
        ${{ inputs.command }}
